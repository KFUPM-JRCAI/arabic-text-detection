[project]
name = "arabic-text-detection"
version = "0.1.0"
description = "Arabic text detection with optional CUDA support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
    "nltk~=3.9",
    "tqdm~=4.66",
    "pandas~=2.2",
    "pypdf2~=3.0",
    "seaborn~=0.13",
    "pyarabic~=0.6",
    "datasets~=2.20",
    "jsonlines~=4.0",
    "xmltodict~=0.13",
    "matplotlib~=3.9",
    "pylatexenc==2.10",
    "accelerate~=0.33",
    "transformers~=4.43",
    "python-dotenv~=1.1",
    "semanticscholar~=0.8",
    "pytorch-lightning~=2.5",
    "farasapy>=0.1.1",
    "numpy>=2.2.6",
    "bitsandbytes>=0.47.0",
    "ninja>=1.13.0",
    "flash-attn~=2.8",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "papermill>=2.6.0",
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

[dependency-groups]
dev = [
    "papermill>=2.6.0",
]
