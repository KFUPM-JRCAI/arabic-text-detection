[project]
name = "arabic-text-detection"
version = "0.1.0"
description = "Arabic text detection with optional CUDA support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
    "nltk~=3.9",
    "tqdm~=4.66",
    "pandas~=2.2",
    "pypdf2~=3.0",
    "seaborn~=0.13",
    "pyarabic~=0.6",
    "requests~=2.32",
    "datasets~=2.20",
    "jsonlines~=4.0",
    "xmltodict~=0.13",
    "matplotlib~=3.9",
    "pylatexenc==2.10",
    "accelerate~=0.33",
    "transformers~=4.43",
    "python-dotenv~=1.1",
    "semanticscholar~=0.8",
    "pytorch-lightning~=2.5",
    "farasapy>=0.0.14",
]

[project.optional-dependencies]
cuda = [
    "flash-attn~=2.6",
    "bitsandbytes~=0.43",
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch>2.8"]
